name: Release

# Cutting a release is a one-liner:
#
#   git tag v2.0.1 && git push origin v2.0.1
#
# That builds the binary for every target, packages each with LICENSE + README,
# writes SHA256SUMS, and publishes a GitHub Release with everything attached.
#
# A manual run (workflow_dispatch) builds and uploads the archives as workflow
# artifacts for inspection but does NOT publish a Release (no tag => no publish).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release and upload assets

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - run: go mod download

      - name: Build & package
        run: |
          set -euo pipefail
          # On a tag push, GITHUB_REF_NAME is the tag (e.g. v2.0.1); on a manual
          # run it is the branch name, which is fine for an inspection build.
          VERSION="${GITHUB_REF_NAME}"
          BIN="evilphish"
          EXT=""
          [ "${GOOS}" = "windows" ] && EXT=".exe"

          mkdir -p dist
          OUT="dist/${BIN}${EXT}"
          # -trimpath for reproducibility; -s -w strip debug info; -X injects the
          # version into main.VERSION (VERSION is a var, so this takes effect).
          go build -trimpath -ldflags "-s -w -X main.VERSION=${VERSION}" -o "${OUT}" .

          PKG="${BIN}_${VERSION}_${GOOS}_${GOARCH}"
          STAGE="$(mktemp -d)"
          cp "${OUT}" "${STAGE}/"
          cp LICENSE README.md "${STAGE}/" 2>/dev/null || true

          if [ "${GOOS}" = "windows" ]; then
            (cd "${STAGE}" && zip -q -r "${PKG}.zip" .)
            mv "${STAGE}/${PKG}.zip" dist/
          else
            tar -C "${STAGE}" -czf "dist/${PKG}.tar.gz" .
          fi

          echo "Built artifacts:"
          ls -l dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    # Only publish when the run was triggered by a version tag.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Collect all archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
          echo "Checksums:"
          cat SHA256SUMS

      - name: Create / update the Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          draft: false
          # A tag like v2.0.1-rc1 is marked as a pre-release automatically.
          prerelease: ${{ contains(github.ref_name, '-') }}
