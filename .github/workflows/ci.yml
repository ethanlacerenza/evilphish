name: CI

# Lint + test on every push and PR, plus a cross-compile sanity check so a
# change that breaks any release target is caught before you ever cut a tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    # -mod=mod lets the go tool fetch and record checksums on the fly, so the
    # pipeline is green even before go.sum is committed. Recommended next step:
    # run `go mod tidy` locally, commit go.sum, then you can drop this and turn
    # setup-go's cache back on for reproducible, checksum-verified builds.
    env:
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false # module cache keying needs go.sum, which isn't committed yet

      # Resolves modules and writes go.sum entries (thanks to -mod=mod).
      - name: Download modules
        run: go mod download

      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Race detector on: the suite (config, security, the RESP/AOF parser,
      # the gophish mock, the test-rig login flow) is concurrency-clean.
      - name: Run tests
        run: go test -race -count=1 ./...

  build-matrix:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - run: go mod download
      - name: Cross-compile (sanity)
        run: go build -trimpath -o /dev/null ./...
